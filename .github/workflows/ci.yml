name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint files
        run: precious lint --all

      - name: Check that the bundles are current
        run: |
          rm -rf bundled
          pnpm run bundle
          git add --intent-to-add bundled/
          git diff --exit-code HEAD -- bundled/

      - name: Vet the Go package
        run: go vet ./...
