openapi: 3.1.2
info:
  title: minFraud web services
  version: 0.1.0
  summary: Fraud risk scoring for an online transaction.
  description: |-
    The minFraud web services score a transaction for fraud risk. Score, Insights, and Factors accept the same request body and return increasingly detailed risk data. Report a transaction's outcome to improve future scoring, and read back manual disposition changes made in the account portal.

    MaxMind can add fields, warning codes, and enum values to a response without a version change. Clients must ignore keys and values that they do not know.
  contact:
    name: MaxMind support
    url: https://support.maxmind.com/
  license:
    name: Apache 2.0 or MIT
    identifier: Apache-2.0 OR MIT
  termsOfService: https://www.maxmind.com/en/terms-of-use
servers:
  - url: https://minfraud.maxmind.com
    description: minFraud web services
security:
  - basicAuth: []
tags:
  - name: Score, Insights, and Factors
    description: Score a transaction for fraud risk.
  - name: Report a Transaction
    description: Report a transaction's outcome to improve future scoring.
  - name: Dispositions
    description: Read manual disposition and note changes made in the account portal.
  - name: Alerts
    description: Receive a webhook when MaxMind re-scores a low-risk transaction as high risk.
externalDocs:
  description: minFraud API documentation
  url: https://dev.maxmind.com/minfraud/api-documentation/
paths:
  /minfraud/v2.0/score:
    servers:
      - url: https://minfraud.maxmind.com
        description: minFraud web services
      - url: https://sandbox.maxmind.com
        description: minFraud sandbox
    post:
      operationId: postScore
      summary: Score a transaction
      description: Returns the overall risk score and the risk for the IP address, but no other risk factor data.
      tags:
        - Score, Insights, and Factors
      externalDocs:
        url: https://dev.maxmind.com/minfraud/api-documentation/responses/
      requestBody:
        $ref: '#/components/requestBodies/Transaction'
      responses:
        '200':
          description: The Score response for the transaction.
          content:
            application/vnd.maxmind.com-minfraud-score+json:
              schema:
                $ref: '#/components/schemas/Score'
              examples:
                score:
                  $ref: '#/components/examples/score'
        '400':
          $ref: '#/components/responses/ScoreBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ScorePayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /minfraud/v2.0/insights:
    servers:
      - url: https://minfraud.maxmind.com
        description: minFraud web services
      - url: https://sandbox.maxmind.com
        description: minFraud sandbox
    post:
      operationId: postInsights
      summary: Score a transaction with IP intelligence
      description: Returns every field in the Score response, plus IP intelligence data such as anonymizer detection, and risk data about the device, email, billing address, shipping address, and credit card.
      tags:
        - Score, Insights, and Factors
      externalDocs:
        url: https://dev.maxmind.com/minfraud/api-documentation/responses/
      requestBody:
        $ref: '#/components/requestBodies/Transaction'
      responses:
        '200':
          description: The Insights response for the transaction.
          content:
            application/vnd.maxmind.com-minfraud-insights+json:
              schema:
                $ref: '#/components/schemas/Insights'
              examples:
                insights:
                  $ref: '#/components/examples/insights'
        '400':
          $ref: '#/components/responses/ScoreBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ScorePayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /minfraud/v2.0/factors:
    servers:
      - url: https://minfraud.maxmind.com
        description: minFraud web services
      - url: https://sandbox.maxmind.com
        description: minFraud sandbox
    post:
      operationId: postFactors
      summary: Score a transaction with risk factors
      description: Returns every field in the Insights response, plus the risk score reasons that explain the risk score.
      tags:
        - Score, Insights, and Factors
      externalDocs:
        url: https://dev.maxmind.com/minfraud/api-documentation/responses/
      requestBody:
        $ref: '#/components/requestBodies/Transaction'
      responses:
        '200':
          description: The Factors response for the transaction.
          content:
            application/vnd.maxmind.com-minfraud-factors+json:
              schema:
                $ref: '#/components/schemas/Factors'
              examples:
                factors:
                  $ref: '#/components/examples/factors'
        '400':
          $ref: '#/components/responses/ScoreBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ScorePayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /minfraud/v2.0/transactions/report:
    post:
      operationId: reportTransaction
      summary: Report a transaction's outcome
      description: Reports a transaction as fraud, legitimate, or another outcome, so MaxMind can use it to improve future risk scores. Give at least one of `ip_address`, `maxmind_id`, `minfraud_id`, and `transaction_id` in the request body so MaxMind can match the report to the original transaction.
      tags:
        - Report a Transaction
      externalDocs:
        url: https://dev.maxmind.com/minfraud/report-a-transaction/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReport'
            examples:
              transactionReport:
                $ref: '#/components/examples/transaction-report'
      responses:
        '204':
          description: MaxMind accepted the report.
        '400':
          $ref: '#/components/responses/ReportBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ReportPayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /minfraud/disposition/v1.0/updates:
    get:
      operationId: listDispositionUpdates
      summary: List disposition and note updates
      description: Returns transactions whose disposition or note changed, through the account portal's manual review, after `updates_after`. Use this only if you set dispositions or notes from the account portal and need those changes in your own system.
      tags:
        - Dispositions
      externalDocs:
        url: https://dev.maxmind.com/minfraud/working-with-transaction-dispositions/
      parameters:
        - name: updates_after
          in: query
          required: true
          description: An exclusive lower bound, as an RFC 3339 timestamp. MaxMind returns only updates made after this time. URL-encode the value, for example send a `+` in the UTC offset as `%2B`. Pass the previous response's `last_update_timestamp` to page through results.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The transactions with a disposition or note update.
          content:
            application/vnd.maxmind.com-disposition-updates+json:
              schema:
                $ref: '#/components/schemas/DispositionUpdatesResponse'
              examples:
                dispositionUpdates:
                  $ref: '#/components/examples/disposition-updates'
        '400':
          $ref: '#/components/responses/DispositionBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  minFraudAlert:
    get:
      operationId: minFraudAlert
      security: []
      summary: Receive a minFraud Alert
      description: |-
        MaxMind monitors a transaction for 24 hours after it first scores 10 or below. If new information raises the re-calculated risk score to 75 or above, MaxMind sends this request to the webhook URL you configure in the account portal. Your endpoint must accept `GET` requests over HTTPS.

        MaxMind can add query parameters. Ignore parameters you do not know. Requests come from `34.27.174.58` or `2600:1900:4000:947::/64`. These source addresses can change.
      tags:
        - Alerts
      externalDocs:
        url: https://dev.maxmind.com/minfraud/alerts/
      parameters:
        - name: User-Agent
          in: header
          required: false
          description: The value is `MaxMind MinFraud Alert Robot`.
          schema:
            type: string
        - name: X-MaxMind-Alert-HMAC-SHA256
          in: header
          required: false
          description: The hex-encoded HMAC-SHA256 signature of the raw query string, using the webhook secret you configure in the account portal. Present only when you configure a secret.
          schema:
            type: string
        - name: city
          in: query
          required: false
          description: The billing city from the original minFraud request.
          schema:
            type: string
            maxLength: 255
        - name: country
          in: query
          required: false
          description: The billing country from the original minFraud request.
          schema:
            type: string
            maxLength: 2
        - name: date
          in: query
          required: false
          description: The date of the original minFraud request, for example `Nov. 1, 2019`.
          schema:
            type: string
            maxLength: 255
        - name: domain
          in: query
          required: false
          description: The email domain from the original minFraud request.
          schema:
            type: string
            maxLength: 255
        - name: i
          in: query
          required: false
          description: The IP address from the original minFraud request.
          schema:
            type: string
            anyOf:
              - format: ipv4
              - format: ipv6
              - maxLength: 0
        - name: maxmindID
          in: query
          required: false
          description: The minFraud Legacy `maxmindID` of the original request.
          schema:
            type: string
            maxLength: 8
        - name: minfraud_id
          in: query
          required: false
          description: The minFraud ID of the original request.
          schema:
            type: string
            format: uuid
        - name: new_risk_score
          in: query
          required: false
          description: The risk score MaxMind recalculated with additional information.
          schema:
            type: number
            minimum: 0.01
            maximum: 99
        - name: old_risk_score
          in: query
          required: false
          description: The risk score as originally calculated.
          schema:
            type: number
            minimum: 0.01
            maximum: 99
        - name: postal
          in: query
          required: false
          description: The billing postal code from the original minFraud request.
          schema:
            type: string
            maxLength: 255
        - name: reason
          in: query
          required: false
          description: A human-readable explanation of why MaxMind sent the alert.
          schema:
            type: string
        - name: reason_code
          in: query
          required: false
          description: 'A machine-readable code for why MaxMind sent the alert. Known values: `CARDER_EMAIL`, `HIGH_RISK_DEVICE`, `HIGH_RISK_IP`, `HOSTING_PROVIDER`, `MANUAL_REVIEW`, `POSTAL_VELOCITY`. These values can change.'
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: The billing region from the original minFraud request.
          schema:
            type: string
            maxLength: 4
        - name: shop_id
          in: query
          required: false
          description: The shop ID from the original minFraud request. Present only when the original request gave one.
          schema:
            type: string
            maxLength: 255
        - name: txnID
          in: query
          required: false
          description: The transaction ID from the original minFraud request.
          schema:
            type: string
            maxLength: 255
        - name: updated_at
          in: query
          required: false
          description: The date and time the new risk score was calculated, in RFC 3339 format, for example `2019-11-01T12:34:56Z`.
          schema:
            type: string
            format: date-time
      responses:
        2XX:
          description: Return a 2xx status to acknowledge the alert.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: The username is your MaxMind account ID. The password is your MaxMind license key. The service accepts HTTPS requests only, with TLS 1.2 or higher.
  requestBodies:
    Transaction:
      description: The request body must not exceed 20,000 bytes.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Request'
          examples:
            request:
              $ref: '#/components/examples/request'
  responses:
    ScoreBadRequest:
      description: |-
        The request is not valid. The `code` is one of:
        - `JSON_INVALID`: the request body is not a JSON object.
        - `REQUEST_INVALID`: the request body is valid JSON but has no valid input values.
        - `REQUEST_TOO_BIG`: the request body is too large.
        - `BAD_REQUEST`: there was a problem reading or decoding the request body.
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              $ref: '#/components/examples/score-bad-request'
    ReportBadRequest:
      description: |-
        The request is not valid. The `code` is one of:
        - `JSON_INVALID`: the request body is not a valid JSON object.
        - `PARAMETER_UNKNOWN`: the request has a key this endpoint does not use.
        - `TAG_REQUIRED`: the request has no `tag`.
        - `TAG_INVALID`: `tag` is not one of the accepted values.
        - `TRANSACTION_ID_REQUIRED`: the request has none of `ip_address`, `maxmind_id`, `minfraud_id`, and `transaction_id`.
        - `IP_ADDRESS_INVALID`: `ip_address` is not a valid IPv4 or IPv6 address.
        - `IP_ADDRESS_RESERVED`: `ip_address` is in a reserved or private range.
        - `MAXMIND_ID_INVALID`: `maxmind_id` is not a valid MaxMind ID. It must be 8 characters of digits and uppercase letters.
        - `MINFRAUD_ID_INVALID`: `minfraud_id` is not a valid UUID.
        - `NOTES_INVALID`: `notes` is over 1000 Unicode characters or contains a NUL character.
        - Other `_INVALID` codes, for example `TRANSACTION_ID_INVALID`: the value of that field is not valid. `TRANSACTION_ID_INVALID` and `CHARGEBACK_CODE_INVALID` also cover a field that contains a NUL character.
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              $ref: '#/components/examples/report-bad-request'
    DispositionBadRequest:
      description: |-
        The request is not valid. The `code` is one of:
        - `UPDATES_AFTER_REQUIRED`: the request has no `updates_after` parameter, or its value is empty.
        - `TIMESTAMP_INVALID`: `updates_after` is not a valid RFC 3339 timestamp.
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              $ref: '#/components/examples/disposition-bad-request'
    Unauthorized:
      description: |-
        The credentials are missing or not valid. The `code` is one of:
        - `AUTHORIZATION_INVALID`: the account ID or license key is not valid.
        - `ACCOUNT_ID_REQUIRED`: the Basic credentials have no account ID.
        - `LICENSE_KEY_REQUIRED`: the Basic credentials have no license key.
      headers:
        WWW-Authenticate:
          description: The authentication scheme, for example `Basic realm="minfraud"`.
          schema:
            type: string
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              value:
                code: AUTHORIZATION_INVALID
                error: Your account ID or license key could not be authenticated.
    PaymentRequired:
      description: The account has no funds for this service (`INSUFFICIENT_FUNDS`).
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              $ref: '#/components/examples/error'
    Forbidden:
      description: The account does not have permission to use this service (`PERMISSION_REQUIRED`). A request that uses HTTP instead of HTTPS also gets this status, but without a JSON body.
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              value:
                code: PERMISSION_REQUIRED
                error: You do not have permission to use the service.
    ScorePayloadTooLarge:
      description: The request body is larger than 20,000 bytes. The response does not have a JSON body.
    ReportPayloadTooLarge:
      description: The request body is too large. The response does not have a JSON body.
    TooManyRequests:
      description: MaxMind rate-limited the request, usually because of too many earlier error responses. The response may have no body.
    InternalServerError:
      description: The service had an unexpected error (`SERVER_ERROR`).
      content:
        application/vnd.maxmind.com-error+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              value:
                code: SERVER_ERROR
                error: There was an error when processing this request.
    ServiceUnavailable:
      description: The service has a temporary problem. Send the request again later. The response does not have a JSON body.
  schemas:
    Account:
      type: object
      properties:
        user_id:
          type: string
          maxLength: 255
          description: Your internal ID for the account. Use an ID that does not change, not a login name that can change. This is not your MaxMind account ID.
        username_md5:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
          description: An MD5 hash of the account username.
    Address:
      type: object
      description: A billing or shipping address.
      properties:
        address:
          type: string
          maxLength: 255
          description: The first line of the street address.
        address_2:
          type: string
          maxLength: 255
          description: The second line of the street address.
        city:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 255
          description: The company name for the address.
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The two-character ISO 3166-1 alpha-2 country code.
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        phone_country_code:
          type: string
          pattern: ^[0-9]{1,4}$
          description: The international calling code for the phone number.
        phone_number:
          type: string
          maxLength: 255
          description: The phone number, without the country code. MaxMind strips punctuation characters. After that, the number must contain only digits.
        postal:
          type: string
          maxLength: 255
          description: The postal code for the address.
        region:
          type: string
          pattern: ^[0-9A-Z]{1,4}$
          description: The ISO 3166-2 subdivision code.
    CreditCard:
      type: object
      properties:
        avs_result:
          type: string
          pattern: ^[A-Za-z1-4]$
          description: The address verification system (AVS) check result, as your payment processor returns it. MaxMind supports the standard AVS codes.
        bank_name:
          type: string
          maxLength: 255
          description: The name of the bank that issued the credit card.
        bank_phone_country_code:
          type: string
          pattern: ^[0-9]{1,4}$
          description: The international calling code for the bank's phone number.
        bank_phone_number:
          type: string
          maxLength: 255
          description: The bank's phone number, without the country code. MaxMind strips punctuation characters. After that, the number must contain only digits.
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The two-character ISO 3166-1 country code of the card issuer's location. You can send this instead of `issuer_id_number` if you do not want to send partial account numbers, or if your payment processor does not provide them.
        cvv_result:
          type: string
          pattern: ^[A-Za-z0-9]$
          description: The card verification value (CVV) check result, as your payment processor returns it.
        issuer_id_number:
          type: string
          pattern: ^([0-9]{6}|[0-9]{8})$
          description: The first 6 or 8 digits of the credit card number. If you do not know whether the number is 6 or 8 digits long, send 6 digits.
        last_digits:
          type: string
          pattern: ^([0-9]{2}|[0-9]{4})$
          description: The last 2 or 4 digits of the credit card number. Send the last 4 digits in most cases. If `issuer_id_number` has 8 digits and the card brand is not Discover, JCB, Mastercard, UnionPay, or Visa, send the last 2 digits.
        token:
          type: string
          maxLength: 255
          pattern: ^[!-~]+$
          not:
            pattern: ^[0-9]{1,19}$
          description: A token that uniquely identifies the card, for example one your payment processor gives you. The token must consist of non-space printable ASCII characters. If the token is all digits, it must be more than 19 characters long. The token must not be a primary account number (PAN) or a simple transformation of one. If a valid token looks like a PAN but is not one, you can prefix it with a fixed string, for example `token-`.
        was_3d_secure_successful:
          type: boolean
          description: Whether the 3-D Secure check for the transaction was successful. Omit this field if 3-D Secure verification was not used, was unavailable, or had another outcome besides success or failure.
    CustomInputs:
      type: object
      description: 'Values for the custom inputs that you configure for your account. Configure each key first, from Custom Inputs in the account portal. Each key must match a key configured for your account, and the value must match the type configured for that key: a boolean, a number from -9999999999999 to 9999999999999, a string of up to 255 characters, or a phone number string of up to 255 characters. MaxMind strips spaces and punctuation from a phone number, and the rest must be digits. A key that your account does not have configured produces an `INPUT_UNKNOWN` warning. Do not send a full credit card number as a value. MaxMind rejects it and returns a warning.'
      additionalProperties:
        oneOf:
          - type: boolean
          - type: number
            minimum: -9999999999999
            maximum: 9999999999999
          - type: string
            maxLength: 255
    Device:
      type: object
      properties:
        accept_language:
          type: string
          maxLength: 255
          description: The HTTP `Accept-Language` header of the device.
        ip_address:
          type: string
          maxLength: 255
          description: The IPv4 or IPv6 address of the device, in presentation format (dotted-quad notation or IPv6 colon notation). A private or reserved address produces an `IP_ADDRESS_RESERVED` warning.
        session_age:
          type: number
          minimum: 0
          maximum: 9999999999999
          description: The number of seconds between the creation of the user's session and the transaction. This is not the length of the current visit. It is the time since the start of the first visit.
        session_id:
          type: string
          maxLength: 255
          description: An ID that identifies a visitor's session on the site.
        tracking_token:
          type: string
          description: The token that the Device Tracking Add-On client-side code returns for explicit device linking.
        user_agent:
          type: string
          maxLength: 512
          description: The HTTP `User-Agent` header of the browser used.
    Email:
      type: object
      properties:
        address:
          type: string
          maxLength: 255
          description: The email address, or the MD5 hash of the normalized email address. Normalize the address before you hash it. See https://dev.maxmind.com/minfraud/normalizing-email-addresses-for-minfraud. A plaintext address must be a valid email address. MaxMind lowercases it, converts an internationalized domain to ASCII, and fixes a few common typos, such as a misspelled `gmail.com`.
        domain:
          type: string
          maxLength: 255
          description: The domain of the email address. Do not include the `@`. You do not need to send this field unless you send the email address as an MD5 hash. MaxMind lowercases the domain, converts an internationalized domain to ASCII, and fixes a few common typos.
    Event:
      type: object
      properties:
        party:
          type: string
          enum:
            - agent
            - customer
          description: The party that submits the transaction.
        shop_id:
          type: string
          maxLength: 255
          description: Your internal ID for the shop, affiliate, or merchant the order comes from. Required for a reseller, payment provider, gateway, or affiliate network. If you are testing the minFraud service, prefix your shop ID with `test`, or set it to `test`.
        time:
          type: string
          format: date-time
          description: |-
            The time the event occurred, in RFC 3339 format. If you omit this field, MaxMind uses the time it receives the request. Do not send this field for a live transaction. Use it only for a stored transaction that you score later.

            The time must be within the past year. For an older time, MaxMind uses the current time to score the transaction and returns a warning.
        transaction_id:
          type: string
          maxLength: 255
          description: Your internal ID for the transaction.
        type:
          type: string
          enum:
            - account_creation
            - account_login
            - credit_application
            - email_change
            - fund_transfer
            - password_reset
            - payout_change
            - purchase
            - recurring_purchase
            - referral
            - sim_swap
            - survey
          description: |-
            The type of event being scored.

            - `account_creation`: the transactor is creating an account.
            - `account_login`: the transactor is logging in to an account.
            - `credit_application`: the transactor is applying for credit.
            - `email_change`: the transactor is changing the email address on an account.
            - `fund_transfer`: the transactor is transferring funds between accounts.
            - `password_reset`: the transactor is resetting a password.
            - `payout_change`: the transactor is changing how you pay them. Use this for any case where you pay your users and they change how you pay them, such as a referral or survey payout.
            - `purchase`: the transactor is making a purchase.
            - `recurring_purchase`: the transactor is setting up a recurring purchase or subscription.
            - `referral`: the transactor is sending you referral traffic, for example by referring someone to your site with an ad.
            - `sim_swap`: for a mobile network operator. A new SIM card or eSIM is being issued for a customer's existing phone number.
            - `survey`: the transactor is starting or completing a survey.
    Order:
      type: object
      properties:
        affiliate_id:
          type: string
          maxLength: 255
          description: Your internal ID for the affiliate that referred the order.
        amount:
          type: number
          minimum: 0
          maximum: 9999999999999
          description: The total order amount before taxes and discounts, in the currency given in `currency`.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: The ISO 4217 currency code for the order amount.
        discount_code:
          type: string
          maxLength: 255
          description: The discount code applied to the order. Separate multiple discount codes with a comma.
        has_gift_message:
          type: boolean
          description: Whether the order included a gift message.
        is_gift:
          type: boolean
          description: Whether the order was marked as a gift.
        referrer_uri:
          type: string
          maxLength: 1024
          format: uri
          description: The URI of the site that referred the customer to your site. Must be an absolute URI with a scheme, such as `https://`.
        subaffiliate_id:
          type: string
          maxLength: 255
          description: Your internal ID for the subaffiliate that referred the order.
    Payment:
      type: object
      properties:
        decline_code:
          type: string
          maxLength: 255
          description: The decline code the payment processor returned. Omit this field if the transaction was not declined.
        method:
          type: string
          enum:
            - bank_debit
            - bank_redirect
            - bank_transfer
            - buy_now_pay_later
            - card
            - crypto
            - digital_wallet
            - gift_card
            - real_time_payment
            - rewards
          description: |-
            The payment method.

            - `bank_debit`: a direct debit of the customer's bank account.
            - `bank_redirect`: the customer authorizes payment after authenticating with their bank.
            - `bank_transfer`: the customer pushes funds directly from their bank account.
            - `buy_now_pay_later`: payment through a buy now, pay later provider, such as Affirm, Afterpay, or Klarna.
            - `card`: payment by a credit, debit, or charge card.
            - `crypto`: payment with a cryptocurrency.
            - `digital_wallet`: payment from a digital wallet linked to a card or bank account, such as Apple Pay, Google Pay, or PayPal.
            - `gift_card`: payment with a merchant-sponsored gift card.
            - `real_time_payment`: the customer pushes funds directly from their bank account or another funding source, using an intermediary such as a phone number to authenticate, for example Pix, PayNow, or Swish.
            - `rewards`: payment with rewards or loyalty program incentives.
