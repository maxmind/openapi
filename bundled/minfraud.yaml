          description: Whether the payment was authorized. Omit this field if the transaction has not yet been approved or denied.
    Shipping:
      description: A shipping address, with the delivery speed for the order.
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          properties:
            delivery_speed:
              type: string
              enum:
                - same_day
                - overnight
                - expedited
                - standard
              description: The shipping speed selected for the order.
    ShoppingCartItem:
      type: object
      description: An item purchased in the order. You can hash `category` and `item_id` with a cryptographic hash function and a fixed salt to protect customer privacy. Do not use a random salt. A random salt produces a different hash each time for the same value, which defeats fraud detection.
      properties:
        category:
          type: string
          maxLength: 255
          description: The category of the item. This can be a hashed value.
        item_id:
          type: string
          maxLength: 255
          description: Your internal ID for the item. This can be a hashed value.
        price:
          type: number
          minimum: 0
          maximum: 9999999999999
          description: The per-unit price of the item. This should use the same currency as the order's `currency`.
        quantity:
          type: integer
          minimum: 0
          maximum: 9999999999999
          description: The quantity of the item purchased.
    Request:
      type: object
      description: |-
        The minFraud request body. Score, Insights, and Factors accept the same request body. Every object is optional. Add more fields to improve accuracy.

        MaxMind can add fields to the request body without a version change. A field that MaxMind does not recognize produces an `INPUT_UNKNOWN` warning.

        A string field allows up to 255 valid Unicode characters unless its schema states a different limit. Null and newline characters are not allowed. MaxMind accepts a number sent as a string and a string sent as a number, and converts it to the type the field requires.

        A value that does not meet a field's constraints, such as its pattern, enum, or length, produces an `INPUT_INVALID` warning in the response. The request still succeeds.
      minProperties: 1
      properties:
        account:
          $ref: '#/components/schemas/Account'
          description: Information about the account involved in the event.
        billing:
          $ref: '#/components/schemas/Address'
          description: The billing address for the order.
        credit_card:
          $ref: '#/components/schemas/CreditCard'
          description: Information about the credit card used.
        custom_inputs:
          $ref: '#/components/schemas/CustomInputs'
        device:
          $ref: '#/components/schemas/Device'
          description: Information about the device used in the transaction.
        email:
          $ref: '#/components/schemas/Email'
          description: Information about the email used in the transaction.
        event:
          $ref: '#/components/schemas/Event'
          description: General information about the event being scored.
        order:
          $ref: '#/components/schemas/Order'
          description: Information about the order.
        payment:
          $ref: '#/components/schemas/Payment'
          description: Information about the payment method used.
        shipping:
          $ref: '#/components/schemas/Shipping'
          description: The shipping address for the order.
        shopping_cart:
          type: array
          description: The items purchased in the order.
          items:
            $ref: '#/components/schemas/ShoppingCartItem'
    Disposition:
      type: object
      description: How a custom rule disposed of the request. Not present when your account has no custom rules.
      properties:
        action:
          type: string
          description: 'How MaxMind handled the request. Known values: `accept`, `reject`, `manual_review`, `test`. MaxMind may add values. `accept` is the default when no custom rule matches. Use `test` to test custom rules.'
        reason:
          type: string
          description: 'Why `action` has its value. Known values: `default`, `custom_rule`. MaxMind may add values.'
        rule_label:
          type: string
          description: The label of the custom rule that was triggered. Not present when you have no custom rules, the triggered rule has no label, or no rule was triggered.
    Warning:
      type: object
      description: |-
        A warning about an issue with the request. The `code` values below are the current set. MaxMind can add more.

        - `BILLING_CITY_NOT_FOUND`: the billing city is not in the MaxMind database.
        - `BILLING_COUNTRY_MISSING`: billing address fields are present but `country` is not.
        - `BILLING_COUNTRY_NOT_FOUND`: the billing country is not in the MaxMind database.
        - `BILLING_POSTAL_NOT_FOUND`: the billing postal code is not in the MaxMind database.
        - `BILLING_REGION_NOT_FOUND`: the billing region is not in the MaxMind database.
        - `EMAIL_ADDRESS_UNUSABLE`: the email address looks incorrect, so MaxMind left it out of scoring.
        - `INPUT_INVALID`: a value does not meet the field's constraints.
        - `INPUT_UNKNOWN`: the request has a key MaxMind does not recognize.
        - `IP_ADDRESS_INVALID`: the IP address is not a valid IPv4 or IPv6 address.
        - `IP_ADDRESS_NOT_FOUND`: MaxMind could not geolocate the IP address.
        - `IP_ADDRESS_RESERVED`: the IP address is in a reserved network.
        - `SHIPPING_CITY_NOT_FOUND`: the shipping city is not in the MaxMind database.
        - `SHIPPING_COUNTRY_MISSING`: shipping address fields are present but `country` is not.
        - `SHIPPING_COUNTRY_NOT_FOUND`: the shipping country is not in the MaxMind database.
        - `SHIPPING_POSTAL_NOT_FOUND`: the shipping postal code is not in the MaxMind database.
        - `SHIPPING_REGION_NOT_FOUND`: the shipping region is not in the MaxMind database.
        - `TRACKING_TOKEN_INVALID`: the tracking token is malformed.
        - `TRACKING_TOKEN_NOT_FOUND`: MaxMind does not recognize the tracking token.

        The address warnings can reduce the accuracy of distance calculations.
      properties:
        code:
          type: string
          maxLength: 255
        input_pointer:
          type: string
          description: A JSON Pointer to the request field the warning is about, for example `/billing/city` or `/shopping_cart/1/price`.
        warning:
          type: string
          description: A human-readable explanation of the warning. The text can change at any time.
    ScoreBase:
      type: object
      description: The fields common to the minFraud Score, Insights, and Factors responses, apart from `ip_address`. Score, Insights, and Factors each have a different shape for `ip_address`.
      properties:
        disposition:
          $ref: '#/components/schemas/Disposition'
          description: How a custom rule disposed of the request.
        funds_remaining:
          type: number
          minimum: 0
          description: The approximate US dollar value of the funds left on your account.
        id:
          type: string
          format: uuid
          description: The minFraud ID for this response. Use it to find the request in your minFraud logs, or when you contact MaxMind support.
        queries_remaining:
          type: integer
          minimum: 0
          description: The approximate number of queries left for this service before your account runs out of funds.
        risk_score:
          type: number
          minimum: 0.01
          maximum: 99
          description: The overall risk score, from 0.01 to 99. A higher score means a higher risk of fraud. For example, a score of 20 means a 20% chance that the transaction is fraudulent. MaxMind never returns 0 or 100, since every transaction carries some possibility of fraud.
        warnings:
          type: array
          description: Issues with the request, such as an invalid or unknown input.
          items:
            $ref: '#/components/schemas/Warning'
      required:
        - id
        - risk_score
        - funds_remaining
        - queries_remaining
    ScoreIPAddress:
      type: object
      description: The risk for the IP address, as returned by minFraud Score.
      properties:
        risk:
          type: number
          minimum: 0.01
          maximum: 99
          description: The risk for the IP address, from 0.01 to 99. A higher value means higher risk.
    Score:
      description: The minFraud Score response.
      allOf:
        - $ref: '#/components/schemas/ScoreBase'
        - type: object
          properties:
            ip_address:
              $ref: '#/components/schemas/ScoreIPAddress'
              description: The risk associated with the IP address.
    Error:
      type: object
      description: Not all error responses have a JSON body. Check the `Content-Type` header before you decode the body as JSON.
      required:
        - code
        - error
      properties:
        code:
          type: string
          description: A static error code for machine use. The meaning of a code never changes, but MaxMind can add or remove codes.
          examples:
            - IP_ADDRESS_INVALID
        error:
          type: string
          description: A human-readable description of the error. The text can change at any time.
          examples:
            - The value '1.2.3' is not a valid IP address.
    AddressInsights:
      type: object
      description: minFraud risk data about a billing address.
      properties:
        distance_to_ip_location:
          type: integer
          description: The distance, in kilometers, from the address to the IP address's location. When MaxMind cannot locate the address or the IP address more precisely, it uses country or subdivision coordinates, which can make this distance inaccurate.
        is_in_ip_country:
          type: boolean
          description: True if the address is in the IP address's country. Present only when MaxMind can geolocate the IP address and the address was given.
        is_postal_in_city:
          type: boolean
          description: True if the postal code is in the city for the address. Present only when the postal code, city, and country were all given. MaxMind matches the postal code against the GeoNames preferred place name for a US ZIP code. An alternative place name for a US ZIP code might not produce a match.
        latitude:
          type: number
          description: The approximate WGS 84 latitude for the address. The coordinates are not precise. Do not use them to identify a street address or household.
        longitude:
          type: number
          description: The approximate WGS 84 longitude for the address. The coordinates are not precise. Do not use them to identify a street address or household.
    Phone:
      type: object
      description: minFraud risk data about a billing or shipping phone number.
      properties:
        country:
          type: string
          description: The two-character ISO 3166-1 country code for the phone number.
        is_voip:
          type: boolean
          description: True if the phone number is a VoIP number allocated by a regulator. Present only for a valid phone number that MaxMind has data for.
        matches_postal:
          type: boolean
          description: True if the phone number's prefix is commonly associated with the postal code. Present only for a US number when MaxMind has the number's prefix, and the postal code and country were also given.
        network_operator:
          type: string
          description: The original network operator associated with the phone number. This does not reflect a number ported to another operator, and it does not identify a mobile virtual network operator.
        number_type:
          type: string
          description: 'The phone number''s type. Known values: `fixed`, `mobile`. MaxMind may add values.'
    CreditCardIssuer:
      type: object
      description: minFraud risk data about a credit card's issuing bank.
      properties:
        matches_provided_name:
          type: boolean
          description: True if `name` matches the issuer name given in the request. Present only when the request gives both a name and an issuer ID number, and MaxMind has a name for that issuer ID number.
        matches_provided_phone_number:
          type: boolean
          description: True if `phone_number` matches the issuer phone number given in the request. Present only when the request gives both a phone number and an issuer ID number, and MaxMind has a phone number for that issuer ID number.
        name:
          type: string
          maxLength: 255
          description: The name of the issuing bank.
        phone_number:
          type: string
          maxLength: 255
          description: The phone number of the issuing bank. This number can be out of date.
    ResponseCreditCard:
      type: object
      description: minFraud risk data about the credit card. Present only when the request includes an issuer ID number.
      properties:
        brand:
          type: string
          maxLength: 255
          description: The card brand, for example "Visa" or "Discover".
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: The two-character ISO 3166-1 country code for the majority of customers using this card, by billing address. If customers are spread across countries, this is the country of the issuing bank instead.
        is_business:
          type: boolean
          description: True if the issuer ID number is for a business card. Present only when a valid issuer ID number was given.
        is_issued_in_billing_address_country:
          type: boolean
          description: True if the billing address country matches the country of the majority of customers using this issuer ID number. Present only when both countries are known. When the customers for this issuer ID number are spread across many countries, MaxMind matches against the country of the issuing bank instead.
        is_prepaid:
          type: boolean
          description: True if the issuer ID number is for a prepaid card. Present only when a valid issuer ID number was given.
        is_virtual:
          type: boolean
          description: True if the issuer ID number is for a virtual card. Present only when a valid issuer ID number was given.
        issuer:
          $ref: '#/components/schemas/CreditCardIssuer'
          description: Data about the bank that issued the card.
        type:
          type: string
          description: 'The card''s type. Known values: `charge`, `credit`, `debit`. MaxMind may add values.'
    ResponseDevice:
      type: object
      description: Data about the device MaxMind associates with the IP address in the request.
      properties:
        confidence:
          type: number
          minimum: 0.01
          maximum: 99
          description: MaxMind's confidence that `id` refers to a unique device rather than a cluster of similar devices, from 0.01 to 99. A higher value means higher confidence.
        id:
          type: string
          format: uuid
          description: MaxMind's ID for the device. Present only when the Device Tracking Add-On is in use.
        last_seen:
          type: string
          format: date-time
          description: The date and time MaxMind last saw the device, in RFC 3339 format.
        local_time:
          type: string
          format: date-time
          description: The local date and time of the transaction in the device's time zone, using the device's UTC offset, in RFC 3339 format.
    EmailDomainVisit:
      type: object
      description: Data from an automated visit to the email domain. Not present for a high-volume domain, such as one for a large email provider or business, and can be delayed for a newly-seen domain.
      properties:
        has_redirect:
          type: boolean
          description: True if the domain redirects to another URL. Absent, not `false`, when the domain does not redirect. When true, `status` describes the domain the visit redirected to.
        last_visited_on:
          type: string
          format: date
          description: The date of the automated visit.
        status:
          type: string
          description: 'The status of the domain, or of the domain a redirect led to, as of the automated visit. Known values: `live`, `dns_error`, `network_error`, `http_error`, `parked`, `pre_development`. MaxMind may add values.'
    EmailDomain:
      type: object
      description: minFraud risk data about an email domain.
      properties:
        classification:
          type: string
          description: 'A classification of the domain. Known values: `business`, `education`, `government`, `isp_email`. MaxMind may add values.'
        first_seen:
          type: string
          format: date
          description: The date MaxMind first saw the email domain. The earliest possible date is 2019-01-01.
        risk:
          type: number
          minimum: 0.01
          maximum: 99
          description: The risk associated with the domain, from 0.01 to 99. A higher value means higher risk.
        visit:
          $ref: '#/components/schemas/EmailDomainVisit'
          description: Data from an automated visit to the email domain.
        volume:
          type: number
          minimum: 0.001
          maximum: 1000000
          description: The activity MaxMind sees on this email domain across the minFraud network, in sightings per million requests. The value is rounded to 2 significant figures.
    ResponseEmail:
      type: object
      description: Email intelligence data.
      properties:
        domain:
          $ref: '#/components/schemas/EmailDomain'
          description: Data about the email domain.
        first_seen:
          type: string
          format: date
          description: The date MaxMind first saw the email address. The earliest possible date is 2008-01-01.
        is_disposable:
          type: boolean
          description: True if MaxMind believes the email address is from a disposable email provider. Present only when the request gives a valid email address or domain.
        is_free:
          type: boolean
          description: True if MaxMind believes the email domain is for a free provider, such as Gmail or Yahoo! Mail. Present only when the request gives a valid email address or domain.
        is_high_risk:
          type: boolean
          description: True if MaxMind believes the email address is likely to be used for fraud. This is also factored into `risk_score`. Present only when the request gives a valid email address or hash.
    AnonymizerResidential:
      type: object
      description: Data about the residential proxy network associated with an IP address. Only in the Insights response.
      properties:
        confidence:
          type: integer
          minimum: 1
          maximum: 99
          description: MaxMind's confidence that the network is an actively used residential proxy, from 1 to 99.
        network_last_seen:
          type: string
          format: date
          description: The last date MaxMind saw the network in its residential proxy analysis.
        provider_name:
          type: string
          description: The name of the residential proxy provider, for example `oxylabs`. MaxMind identifies only a subset of residential proxy providers.
    Anonymizer:
      type: object
      description: Whether an IP address is part of an anonymizing service or network. Only in the Insights response.
      properties:
        confidence:
          type: integer
          minimum: 1
          maximum: 99
          description: MaxMind's confidence that the network is an actively used VPN, from 1 to 99. MaxMind currently returns only 30 or 99, and will add more values over time.
        is_anonymous:
          type: boolean
          description: True if the IP address belongs to any anonymous network.
        is_anonymous_vpn:
          type: boolean
          description: True if the IP address belongs to an anonymous VPN provider. Some VPN providers register their ranges under other names, so MaxMind may flag them with `is_hosting_provider` instead.
        is_hosting_provider:
          type: boolean
          description: True if the IP address belongs to a hosting provider.
        is_public_proxy:
          type: boolean
          description: True if the IP address belongs to a public proxy.
        is_residential_proxy:
          type: boolean
          description: True if the IP address is on a suspected anonymizing network and belongs to a residential ISP. This excludes peer-to-peer proxy IP addresses.
        is_tor_exit_node:
          type: boolean
          description: True if the IP address is a Tor exit node.
        network_last_seen:
          type: string
          format: date
          description: The last date MaxMind saw the network in its anonymizer analysis.
        provider_name:
          type: string
          description: The name of the VPN provider, for example `nordvpn`. MaxMind identifies only a subset of VPN providers.
        residential:
          $ref: '#/components/schemas/AnonymizerResidential'
    Names:
      type: object
      description: 'A map from a locale code to the localized name for the entity. Known locale codes: de, en, es, fr, ja, pt-BR, ru, zh-CN. If the entity has name data, en is present. No other locale is guaranteed. Names can change between releases. Do not use them as keys. Use `geoname_id`, `iso_code`, or `code`.'
      additionalProperties:
        type: string
    City:
      type: object
      description: The city associated with an IP address.
      properties:
        geoname_id:
          type: integer
          minimum: 0
          description: The GeoNames ID for the city.
        names:
          $ref: '#/components/schemas/Names'
    CityWithConfidence:
      description: A city associated with an IP address, with MaxMind's confidence in the result. Only the Insights response's `city` object includes `confidence`.
      allOf:
        - $ref: '#/components/schemas/City'
        - type: object
          properties:
            confidence:
              type: integer
              minimum: 0
              maximum: 100
              description: MaxMind's confidence that the city is correct, from 0 to 100.
    Continent:
      type: object
      description: The continent associated with an IP address.
      properties:
        code:
          type: string
          description: The two-character code for the continent.
          enum:
            - AF
            - AN
            - AS
            - EU
            - NA
            - OC
            - SA
        geoname_id:
          type: integer
          minimum: 0
          description: The GeoNames ID for the continent.
        names:
          $ref: '#/components/schemas/Names'
    Country:
      type: object
      description: A country associated with an IP address.
      properties:
        geoname_id:
          type: integer
          minimum: 0
          description: The GeoNames ID for the country.
        iso_code:
          type: string
          description: The two-character ISO 3166-1 country code.
        is_in_european_union:
          type: boolean
          description: True if the country is a member state of the European Union.
        names:
          $ref: '#/components/schemas/Names'
    CountryWithConfidence:
      description: A country associated with an IP address, with MaxMind's confidence in the result. Only the Insights response's `country` object includes `confidence`.
      allOf:
        - $ref: '#/components/schemas/Country'
        - type: object
          properties:
            confidence:
              type: integer
              minimum: 0
              maximum: 100
              description: MaxMind's confidence that the country is correct, from 0 to 100.
    InsightsIPAddressCountry:
      description: A country associated with an IP address, with MaxMind's confidence in the result and whether MaxMind considers the country high-risk.
      allOf:
        - $ref: '#/components/schemas/CountryWithConfidence'
        - type: object
          properties:
            is_high_risk:
              type: boolean
              deprecated: true
              description: Deprecated. True if MaxMind considers the IP address's country to be high-risk.
    Location:
      type: object
      description: Location details for an IP address.
      properties:
        accuracy_radius:
          type: integer
          minimum: 0
          description: The approximate accuracy radius, in kilometers, around the latitude and longitude. MaxMind has 67% confidence that the true location falls within this radius of the coordinates.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: The approximate WGS 84 latitude for the location. The coordinates are not precise. Do not use them to identify a street address or household. When you show the coordinates, also show `accuracy_radius`.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: The approximate WGS 84 longitude for the location. The coordinates are not precise. Do not use them to identify a street address or household. When you show the coordinates, also show `accuracy_radius`.
        metro_code:
          type: integer
          minimum: 0
          deprecated: true
          description: Deprecated. A code that Google previously used to target ads. MaxMind no longer maintains this code.
        time_zone:
          type: string
          description: The IANA time zone for the location, for example `America/New_York`.
    InsightsLocation:
      description: Location details for an IP address, including the fields the Insights response adds beyond City Plus.
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          properties:
            average_income:
              type: integer
              minimum: 0
              description: The average annual income, in US dollars, for the IP address's location. Only available for IP addresses in the US.
            population_density:
              type: integer
              minimum: 0
              description: The estimated number of people per square kilometer at the IP address's location. Only available for IP addresses in the US.
    InsightsIPAddressLocation:
      description: Location details for an IP address, including the local time at that location.
      allOf:
        - $ref: '#/components/schemas/InsightsLocation'
        - type: object
          properties:
            local_time:
              type: string
              format: date-time
              description: The date and time of the transaction in the time zone associated with the IP address, in RFC 3339 format.
    Postal:
      type: object
      description: The postal code associated with an IP address.
      properties:
        code:
          type: string
          description: 'A postal code close to the IP address''s location. For some countries, MaxMind returns only part of the code, with this many characters: Brazil 5, Canada 3, Ireland 3, Japan 7, Netherlands 4, Portugal 7, Singapore 2, United Kingdom 2-4, United States 5. For Japan, the last digit defaults to 1. For Portugal, the last 3 digits often default to `-001`.'
    PostalWithConfidence:
      description: A postal code associated with an IP address, with MaxMind's confidence in the result. Only the Insights response's `postal` object includes `confidence`.
      allOf:
        - $ref: '#/components/schemas/Postal'
        - type: object
          properties:
            confidence:
              type: integer
              minimum: 0
              maximum: 100
              description: MaxMind's confidence that the postal code is correct, from 0 to 100.
    RepresentedCountry:
      description: The country represented by users of an IP address, for example the country represented by an overseas military base.
      allOf:
        - $ref: '#/components/schemas/Country'
        - type: object
          properties:
            type:
              type: string
              description: 'The type of represented country. Known value: military. MaxMind may add other values.'
    IPRiskReason:
      type: object
      description: |-
        A reason why an IP address received its risk. The `code` values below are the current set. MaxMind can add more.

        - `ANONYMOUS_IP`: the IP address belongs to an anonymous network.
        - `BILLING_POSTAL_VELOCITY`: many billing postal codes have been seen on this IP address.
        - `EMAIL_VELOCITY`: many email addresses have been seen on this IP address.
        - `HIGH_RISK_DEVICE`: a high-risk device was seen on this IP address.
        - `HIGH_RISK_EMAIL`: a high-risk email address was seen on this IP address in your past transactions.
        - `ISSUER_ID_NUMBER_VELOCITY`: many issuer ID numbers have been seen on this IP address.
        - `MINFRAUD_NETWORK_ACTIVITY`: MaxMind has seen suspicious activity on this IP address across minFraud customers.
      properties:
        code:
          type: string
          maxLength: 255
        reason:
          type: string
          description: A human-readable explanation of the reason. The text can change at any time.
    Subdivision:
      type: object
      description: A subdivision of the country associated with an IP address.
      properties:
        geoname_id:
          type: integer
          minimum: 0
          description: The GeoNames ID for the subdivision.
        iso_code:
          type: string
          description: Up to three characters from the ISO 3166-2 code for the subdivision.
        names:
          $ref: '#/components/schemas/Names'
    SubdivisionWithConfidence:
      description: A subdivision of the country associated with an IP address, with MaxMind's confidence in the result. Only the Insights response's `subdivisions` entries include `confidence`.
      allOf:
        - $ref: '#/components/schemas/Subdivision'
        - type: object
          properties:
            confidence:
              type: integer
              minimum: 0
              maximum: 100
              description: MaxMind's confidence that the subdivision is correct, from 0 to 100.
    CountryTraits:
      type: object
      description: General traits for an IP address, as returned by the Country response.
      required:
        - ip_address
        - network
      properties:
        ip_address:
          type: string
          description: The IPv4 or IPv6 address that was looked up.
        is_anycast:
          type: boolean
          description: True if the IP address belongs to an anycast network.
        network:
          type: string
          description: The largest network, in CIDR notation, that shares the same data as this record, apart from `ip_address` itself.
    CityTraits:
      description: General traits for an IP address, including the fields the City Plus response adds beyond Country.
      allOf:
        - $ref: '#/components/schemas/CountryTraits'
        - type: object
          properties:
            autonomous_system_number:
              type: integer
              minimum: 0
              description: The autonomous system number for the IP address.
            autonomous_system_organization:
              type: string
              description: The organization for the autonomous system number.
            connection_type:
              type: string
              description: 'The connection type for the IP address. Known values: `Cable/DSL`, `Cellular`, `Corporate`, `Satellite`. MaxMind may add values. GeoLite City does not include this field.'
            domain:
              type: string
              description: The second-level domain for the IP address, for example `example.com`. This is not a subdomain such as `foo.example.com`. GeoLite City does not include this field.
            isp:
              type: string
              description: The ISP for the IP address. GeoLite City does not include this field.
            mobile_country_code:
              type: string
              description: The mobile country code (MCC) for the IP address and ISP. GeoLite City does not include this field.
            mobile_network_code:
              type: string
              description: The mobile network code (MNC) for the IP address and ISP. GeoLite City does not include this field.
            organization:
              type: string
              description: The organization for the IP address. GeoLite City does not include this field.
    InsightsTraits:
      description: General traits for an IP address, including the fields the Insights response adds beyond City Plus.
      allOf:
        - $ref: '#/components/schemas/CityTraits'
        - type: object
          properties:
            ip_risk_snapshot:
              type: number
              minimum: 0.01
              maximum: 99
              description: A snapshot of the risk for the IP address, from 0.01 to 99. A higher value means higher risk. This score changes less often than the equivalent minFraud score and does not respond to traffic on your network. MaxMind omits this field when it has no signals for the network or when the signals show the network is low risk.
            is_anonymous:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address belongs to any anonymous network. Moved to the `anonymizer` object. Kept here for backward compatibility.
            is_anonymous_vpn:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address belongs to an anonymous VPN provider. Moved to the `anonymizer` object. Kept here for backward compatibility.
            is_hosting_provider:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address belongs to a hosting provider. Moved to the `anonymizer` object. Kept here for backward compatibility.
            is_public_proxy:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address belongs to a public proxy. Moved to the `anonymizer` object. Kept here for backward compatibility.
            is_residential_proxy:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address is on a suspected anonymizing network and belongs to a residential ISP. This excludes peer-to-peer proxy IP addresses. Moved to the `anonymizer` object. Kept here for backward compatibility.
            is_tor_exit_node:
              type: boolean
              deprecated: true
              description: Deprecated. True if the IP address is a Tor exit node. Moved to the `anonymizer` object. Kept here for backward compatibility.
            static_ip_score:
              type: number
              minimum: 0
              maximum: 99.99
              description: How static the IP address is, from 0 to 99.99. A higher value means a more static address.
            user_count:
              type: integer
              minimum: 0
              description: The estimated number of users on the IP address or network in the past 24 hours. For IPv4, this counts the single IP address. For IPv6, this counts the /64 network.
            user_type:
              type: string
              description: 'The user type for the IP address. Known values: `business`, `cafe`, `cellular`, `college`, `consumer_privacy_network`, `content_delivery_network`, `government`, `hosting`, `library`, `military`, `residential`, `router`, `school`, `search_engine_spider`, `traveler`.'
    InsightsIPAddress:
      type: object
      description: IP intelligence for the IP address, as returned by minFraud Insights and Factors. This is the GeoIP Insights response body, with `risk` and `risk_reasons` added, `is_high_risk` added to `country`, `local_time` added to `location`, and no `maxmind` object. Every field can be absent if MaxMind has no data for the IP address.
      properties:
        anonymizer:
          $ref: '#/components/schemas/Anonymizer'
          description: Anonymizer data for the IP address.
        city:
          $ref: '#/components/schemas/CityWithConfidence'
          description: The city for the IP address.
        continent:
          $ref: '#/components/schemas/Continent'
          description: The continent for the IP address.
        country:
          $ref: '#/components/schemas/InsightsIPAddressCountry'
          description: The country where MaxMind believes the IP address's user is located.
        location:
          $ref: '#/components/schemas/InsightsIPAddressLocation'
          description: Location details for the IP address.
        postal:
          $ref: '#/components/schemas/PostalWithConfidence'
          description: The postal code for the IP address.
        registered_country:
          $ref: '#/components/schemas/Country'
          description: The country where the ISP registered the IP address.
        represented_country:
          $ref: '#/components/schemas/RepresentedCountry'
        risk:
          type: number
          minimum: 0.01
          maximum: 99
          description: The risk for the IP address, from 0.01 to 99. A higher value means higher risk.
        risk_reasons:
          type: array
          description: Why the IP address received its risk.
          items:
            $ref: '#/components/schemas/IPRiskReason'
        subdivisions:
          type: array
          description: The subdivisions of the country associated with the IP address, ordered from largest to smallest.
          items:
            $ref: '#/components/schemas/SubdivisionWithConfidence'
        traits:
          $ref: '#/components/schemas/InsightsTraits'
          description: General traits for the IP address.
    ShippingAddressInsights:
      description: minFraud risk data about a shipping address.
      allOf:
        - $ref: '#/components/schemas/AddressInsights'
        - type: object
          properties:
            distance_to_billing_address:
              type: integer
              description: The distance, in kilometers, from the shipping address to the billing address. When MaxMind cannot locate an address more precisely, it uses country or subdivision coordinates, which can make this distance inaccurate.
            is_high_risk:
              type: boolean
              description: True if MaxMind associates the shipping address with fraudulent transactions. Present only when a shipping address was given.
    Insights:
      description: The minFraud Insights response. It has every field in the Score response, plus more IP intelligence and risk factor data.
      allOf:
        - $ref: '#/components/schemas/ScoreBase'
        - type: object
          properties:
            billing_address:
              $ref: '#/components/schemas/AddressInsights'
              description: Data about the billing address.
            billing_phone:
              $ref: '#/components/schemas/Phone'
              description: Data about the billing phone number.
            credit_card:
              $ref: '#/components/schemas/ResponseCreditCard'
              description: Data about the credit card. Present only when the request includes an issuer ID number.
            device:
              $ref: '#/components/schemas/ResponseDevice'
              description: Data about the device MaxMind associates with the IP address in the request.
            email:
              $ref: '#/components/schemas/ResponseEmail'
              description: Email intelligence data.
            ip_address:
              $ref: '#/components/schemas/InsightsIPAddress'
              description: IP intelligence data.
            shipping_address:
              $ref: '#/components/schemas/ShippingAddressInsights'
              description: Data about the shipping address.
            shipping_phone:
              $ref: '#/components/schemas/Phone'
              description: Data about the shipping phone number.
    CodeAndReason:
      type: object
      description: 'A machine-readable code and a human-readable reason for part of the risk score. MaxMind can add codes. Known examples: `ANONYMOUS_IP`, `COUNTRY`, `ORG_DISTANCE_RISK`.'
      properties:
        code:
          type: string
          maxLength: 255
          description: A machine-readable code that identifies the reason.
        reason:
          type: string
          description: A human-readable explanation of the reason. The text can change at any time.
    RiskScoreReason:
      type: object
      description: A reason for part of the risk score. Usually present only for a medium to high risk transaction.
      properties:
        multiplier:
          type: number
          minimum: 0.01
          maximum: 100
          description: The factor by which the reasons in `reasons` change the risk score. A value above 1 raises the score. A value below 1 lowers it.
        reasons:
          type: array
          description: The reasons for the multiplier.
          items:
            $ref: '#/components/schemas/CodeAndReason'
    Factors:
      description: The minFraud Factors response. It has every field in the Insights response, plus the risk score reasons.
      allOf:
        - $ref: '#/components/schemas/Insights'
        - type: object
          properties:
            risk_score_reasons:
              type: array
              description: The reasons for the risk score. Usually present only for a medium to high risk transaction. Not present when no reason changed the score significantly.
              items:
                $ref: '#/components/schemas/RiskScoreReason'
    TransactionReport:
      type: object
      description: A report of a transaction as fraud, legitimate, or another outcome. You must give at least one of `ip_address`, `maxmind_id`, `minfraud_id`, and `transaction_id`. Give as many of them as you have. This helps MaxMind match the report to the original transaction.
      required:
        - tag
      additionalProperties: false
      anyOf:
        - required:
            - ip_address
        - required:
            - maxmind_id
        - required:
            - minfraud_id
        - required:
            - transaction_id
      properties:
        chargeback_code:
          type: string
          description: The reason code your payment processor gives for a chargeback.
        ip_address:
          type: string
          anyOf:
            - format: ipv4
            - format: ipv6
          description: The IP address of the customer placing the order.
        maxmind_id:
          type: string
          pattern: ^[0-9A-Z]{8}$
          description: The eight-character ID for a minFraud Legacy request. MaxMind returns this in the `maxmindID` field of a minFraud Legacy response. The value must be one MaxMind returned. The value is case sensitive and has only digits and uppercase letters.
        minfraud_id:
          type: string
          format: uuid
          description: The minFraud ID for a minFraud Score, Insights, or Factors request. MaxMind returns this at `/id` in the response.
        notes:
          type: string
          maxLength: 1000
          description: Your notes on the tag for this transaction.
        tag:
          type: string
          enum:
            - chargeback
            - clear
            - not_fraud
            - spam_or_abuse
            - suspected_fraud
          description: |-
            How likely you believe the transaction is to be fraudulent.

            - `chargeback`: associate a chargeback with the transaction.
            - `clear`: retract a previous report, because the initial classification was incorrect.
            - `not_fraud`: the transaction was a false positive.
            - `spam_or_abuse`: the transaction was linked to spam or abuse.
            - `suspected_fraud`: a high-risk transaction where fraud has not yet been confirmed.
        transaction_id:
          type: string
          minLength: 1
          description: The transaction ID you gave in the original minFraud request.
    DispositionUpdate:
      type: object
      required:
        - minfraud_id
      properties:
        action:
          type:
            - string
            - 'null'
          description: 'The transaction''s most recent disposition action. Known values: `accept`, `reject`, `manual_review`, and `expired_review`, which means the one-week manual review period expired before review.'
        action_last_updated:
          type:
            - string
            - 'null'
          format: date-time
          description: The date and time the disposition action was last updated, in RFC 3339 format with microsecond precision.
        minfraud_id:
          type: string
          format: uuid
          description: The transaction's minFraud ID.
        note:
          type:
            - string
            - 'null'
          maxLength: 500
          description: The transaction's most recent note. Null if no note is set.
        note_last_updated:
          type:
            - string
            - 'null'
          format: date-time
          description: The date and time the note was last updated, in RFC 3339 format with microsecond precision. Null if the transaction never had a note.
    DispositionUpdatesResponse:
      type: object
      required:
        - last_update_timestamp
        - updates
      properties:
        last_update_timestamp:
          type: string
          format: date-time
          description: The sort timestamp of the last transaction in `updates`, in RFC 3339 format with microsecond precision. This can differ from that transaction's `action_last_updated` and `note_last_updated`. Pass this value as `updates_after` in your next request. An empty `updates` array means there are no updates after `updates_after` yet. This value is then not a transaction's timestamp, so keep your current `updates_after` for the next request.
        updates:
          type: array
          description: The transactions with a disposition or note update after `updates_after`, including a transaction whose manual review period expired. MaxMind sorts by the earliest update timestamp, either the disposition or the note, after `updates_after`. A response usually holds at most 1000 updated transactions. Do not rely on this limit. A transaction can appear in more than one response, for example when its note changes after its disposition, so process updates idempotently.
          items:
            $ref: '#/components/schemas/DispositionUpdate'
